app:
  name: "SandSwap AI"
  version: "0.1.0"

llm:
  default_model: "llama3"

memory:
  vector_db: "qdrant"

rag:
  embedding_provider: "mock"
  embedding_model: "nomic-embed-text"
  ollama_base_url: "http://127.0.0.1:11434"
  embedding_timeout: 120
  ocr_provider: "tesseract"
  chunk_size: 18
  chunk_overlap: 4

multimodal:
  vision_provider: "none"
  ocr_provider: "none"
  cache_enabled: true
  max_image_size: 10485760
  supported_types:
    - "image"
    - "pdf"
    - "word"
    - "excel"
    - "powerpoint"
    - "text"
    - "csv"

logging:
  level: "INFO"
